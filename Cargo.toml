[package]
name = "fcm"
version = "1.0.0"
authors = [
  "Suvish Varghese Thoovamalayil <vishy1618@gmail.com>",
  "panicbit <panicbit.dev@gmail.com>",
  "Julius de Bruijn <pimeys@gmail.com>",
  "Richard Jansen <demo_epso@proton.me>"
]
description = "An API to talk to FCM (Firebase Cloud Messaging) in Rust"
license = "MIT"
homepage = "https://github.com/rj76/fcm-rust"
repository = "https://github.com/rj76/fcm-rust"
documentation = "https://docs.rs/fcm/"
keywords = ["fcm", "firebase", "notification"]
edition = "2018"

[features]
default = ["rustls"]

native-tls = ["reqwest/native-tls", "yup-oauth2/hyper-tls"]
rustls = ["reqwest/rustls", "yup-oauth2/hyper-rustls"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53", features = ["fs"] }
reqwest = { version = "0.13", features = ["json", "charset", "http2", "system-proxy"], default-features = false }
chrono = "0.4"
thiserror = "2"
dotenvy = "0.15"
yup-oauth2 = { version = "12.1", features = ["service-account", "aws-lc-rs"], default-features = false }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
clap = { version = "4.6", features = ["cargo", "derive"] }
